<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.todo-container {
    background: #ffffff;
    width: 100%;
    max-width: 650px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
}

h2 {
    color: #1a202c;
    margin-bottom: 25px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
}

.input-section {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

#todo-input1, 
#todo-input2 {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
    background: #fdfdfd;
}

#todo-input1:focus, 
#todo-input2:focus {
    border-color: #667eea;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
}

#add-btn {
    background-color: #667eea;
    color: white;
    border: none;
    padding: 14px 26px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
}

#add-btn:hover {
    background-color: #5a6fd6;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.task-list {
    list-style: none;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* Card Styling */
.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    border-left: 6px solid #667eea;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    transition: all 0.3s ease;
    gap: 14px;
}

.task-item:hover {
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    transform: translateY(-2px);
}

/* Text First */
.task-text {
    color: #2d3748;
    font-size: 16px;
    word-break: break-all;
    cursor: pointer;
    font-weight: 600;
}

/* Number After Name with Badge look */
.task-number {
    font-weight: 500;
    color: #4a5568;
    background: #f7fafc;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    font-size: 14px;
    white-space: nowrap;
}

.task-item.completed {
    border-left-color: #a0aec0;
    background: #f8fafc;
    opacity: 0.85;
}

.task-item.completed .task-text {
    text-decoration: line-through;
    color: #a0aec0;
}

/* Actions Last with proper separation */
.task-actions {
    display: flex;
    gap: 8px;
    margin-left: 4px;
}

.edit-btn {
    background-color: #d69e2e;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.edit-btn:hover {
    background-color: #b7791f;
}

.save-btn {
    background-color: #48bb78;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.save-btn:hover {
    background-color: #38a169;
}

.delete-btn {
    background-color: #e53e3e;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.delete-btn:hover {
    background-color: #c53030;
}

/* Edit mode input style
.task-item input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border: 2px solid #667eea;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    background: #ffffff;
} */
    </style>

    <div class="todo-container">
        <h2>My To-Do List</h2>
        <div class="input-section">
            <input type="text" id="todo-input1" placeholder="UserName">
            <input type="number" id="todo-input2" placeholder="Add your Number">
            <button id="add-btn">Add</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
    </div>
